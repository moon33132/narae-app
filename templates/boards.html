<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>게시판</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Black+Han+Sans&display=swap');
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{--navy:#0D47A1;--sky:#4FC3F7;--green:#43A047;--red:#E53935;--orange:#FF6F00;--bg:#E3F2FD;}
  body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);min-height:100vh;}
  .topbar{background:var(--navy);color:#fff;padding:13px 20px;display:flex;align-items:center;justify-content:space-between;}
  .topbar h1{font-family:'Black Han Sans';font-size:18px;}
  .back-btn{background:rgba(255,255,255,.18);border:none;color:#fff;padding:5px 12px;border-radius:8px;font-size:13px;cursor:pointer;text-decoration:none;font-family:'Noto Sans KR';}
  .main{max-width:640px;margin:0 auto;padding:20px 16px;}
  .board-list{display:flex;flex-direction:column;gap:12px;}
  .board-item{background:#fff;border-radius:16px;padding:18px 20px;box-shadow:0 2px 10px rgba(13,71,161,.08);display:flex;align-items:center;justify-content:space-between;text-decoration:none;transition:all .15s;border:2px solid transparent;}
  .board-item:hover{border-color:var(--sky);transform:translateY(-2px);}
  .board-info{flex:1;}
  .board-title{font-family:'Black Han Sans';font-size:18px;color:var(--navy);margin-bottom:4px;}
  .board-meta{font-size:12px;color:#aaa;}
  .board-arrow{font-size:24px;color:#bbb;margin-left:12px;}
  .empty{text-align:center;padding:48px 16px;color:#aaa;}
  .empty .emoji{font-size:48px;display:block;margin-bottom:12px;}
</style>
</head>
<body>
<div class="topbar">
  <h1>📌 게시판</h1>
  <a href="{{ '/teacher' if is_teacher else '/student' }}" class="back-btn">← 돌아가기</a>
</div>
<div class="main">
  {% if boards %}
  <div class="board-list">
    {% for b in boards %}
    <a class="board-item" href="/board/{{ b.id }}">
      <div class="board-info">
        <div class="board-title">📌 {{ b.title }}</div>
        <div class="board-meta">{{ b.created }} 개설</div>
      </div>
      <div class="board-arrow">›</div>
    </a>
    {% endfor %}
  </div>
  {% else %}
  <div class="empty">
    <span class="emoji">📭</span>
    {% if is_teacher %}선생님이 게시판을 만들면 여기에 나타나요
    {% else %}아직 열린 게시판이 없어요{% endif %}
  </div>
  {% endif %}
</div>
</body>
</html>
