<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5학년 나래반</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Black+Han+Sans&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sky: #4FC3F7;
    --navy: #0D47A1;
    --yellow: #FFD600;
    --green: #43A047;
    --red: #E53935;
    --bg: #E3F2FD;
    --card: #ffffff;
    --text: #1a237e;
  }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-image:
      radial-gradient(circle at 20% 20%, #bbdefb 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, #e1f5fe 0%, transparent 50%);
  }

  .container {
    width: 100%;
    max-width: 480px;
    padding: 20px;
  }

  .header {
    text-align: center;
    margin-bottom: 32px;
  }
  .header .emoji { font-size: 64px; display: block; margin-bottom: 12px; }
  .header h1 {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 36px;
    color: var(--navy);
    letter-spacing: -1px;
  }
  .header p { color: #5c6bc0; margin-top: 6px; font-size: 15px; }

  .card {
    background: var(--card);
    border-radius: 20px;
    padding: 32px;
    box-shadow: 0 8px 32px rgba(13,71,161,0.12);
  }

  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 28px;
  }
  .tab-btn {
    flex: 1;
    padding: 12px;
    border: 2.5px solid #e0e0e0;
    border-radius: 12px;
    background: #f5f5f5;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all .2s;
    color: #888;
  }
  .tab-btn.active {
    background: var(--navy);
    border-color: var(--navy);
    color: #fff;
  }

  .form-panel { display: none; }
  .form-panel.active { display: block; }

  label { display: block; font-size: 13px; font-weight: 700; color: #5c6bc0; margin-bottom: 6px; }

  select, input[type=password] {
    width: 100%;
    padding: 14px 16px;
    border: 2px solid #e0e0e0;
    border-radius: 12px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 16px;
    color: var(--text);
    margin-bottom: 16px;
    outline: none;
    transition: border-color .2s;
    background: #fafafa;
  }
  select:focus, input[type=password]:focus { border-color: var(--sky); background: #fff; }

  .btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 12px;
    font-family: 'Black Han Sans', sans-serif;
    font-size: 18px;
    cursor: pointer;
    transition: all .2s;
    letter-spacing: 1px;
  }
  .btn-student { background: var(--sky); color: var(--navy); }
  .btn-student:hover { background: #29B6F6; transform: translateY(-2px); box-shadow: 0 4px 16px rgba(79,195,247,0.4); }
  .btn-teacher { background: var(--navy); color: #fff; }
  .btn-teacher:hover { background: #1565C0; transform: translateY(-2px); box-shadow: 0 4px 16px rgba(13,71,161,0.35); }

  .error {
    background: #ffebee;
    border: 1.5px solid #ef9a9a;
    color: var(--red);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    margin-bottom: 14px;
    text-align: center;
  }

  .num-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
    margin-bottom: 18px;
  }
  .num-btn {
    aspect-ratio: 1;
    border: 2px solid #e3f2fd;
    border-radius: 10px;
    background: #f3f8ff;
    font-size: 15px;
    font-weight: 700;
    color: var(--navy);
    cursor: pointer;
    transition: all .15s;
    font-family: 'Noto Sans KR', sans-serif;
  }
  .num-btn:hover, .num-btn.selected {
    background: var(--sky);
    border-color: var(--sky);
    color: var(--navy);
    transform: scale(1.08);
  }
  input[name=student_num] { display: none; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <span class="emoji">🌟</span>
    <h1>5학년 나래반</h1>
    <p>선생님과 함께하는 우리 반 공간</p>
  </div>

  <div class="card">
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <div class="tabs">
      <button class="tab-btn active" onclick="showTab('student')">학생</button>
      <button class="tab-btn" onclick="showTab('teacher')">선생님</button>
    </div>

    <!-- 학생 패널 -->
    <div class="form-panel active" id="panel-student">
      <form method="post" action="/login" id="student-form">
        <input type="hidden" name="role" value="student">
        <input type="hidden" name="student_num" id="selected-num" value="">
        <label>내 번호를 눌러주세요</label>
        <div class="num-grid">
          {% for n in range(1, student_count+1) %}
          <button type="button" class="num-btn" onclick="selectNum(this, {{n}})">{{n}}</button>
          {% endfor %}
        </div>
        <button type="submit" class="btn btn-student">입장하기</button>
      </form>
    </div>

    <!-- 선생님 패널 -->
    <div class="form-panel" id="panel-teacher">
      <form method="post" action="/login">
        <input type="hidden" name="role" value="teacher">
        <label>선생님 비밀번호</label>
        <input type="password" name="password" placeholder="비밀번호 입력" autocomplete="off">
        <button type="submit" class="btn btn-teacher">선생님 입장</button>
      </form>
    </div>
  </div>
</div>

<script>
function showTab(tab) {
  document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', (tab==='student'&&i===0)||(tab==='teacher'&&i===1)));
  document.getElementById('panel-student').classList.toggle('active', tab==='student');
  document.getElementById('panel-teacher').classList.toggle('active', tab==='teacher');
}
function selectNum(btn, n) {
  document.querySelectorAll('.num-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  document.getElementById('selected-num').value = n;
}
document.getElementById('student-form').addEventListener('submit', function(e) {
  if (!document.getElementById('selected-num').value) {
    e.preventDefault();
    alert('번호를 먼저 눌러주세요!');
  }
});
</script>
</body>
</html>
