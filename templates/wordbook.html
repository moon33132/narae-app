<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>나래반 단어장</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Black+Han+Sans&display=swap');
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{--navy:#0D47A1;--sky:#4FC3F7;--green:#43A047;--red:#E53935;--bg:#E3F2FD;--purple:#7B1FA2;--yellow:#FFD600;}
  body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);min-height:100vh;}

  /* 상단바 */
  .topbar{background:var(--navy);color:#fff;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;}
  .topbar h1{font-family:'Black Han Sans';font-size:18px;}
  .back-btn{background:rgba(255,255,255,.18);border:none;color:#fff;padding:5px 12px;border-radius:8px;font-size:13px;cursor:pointer;text-decoration:none;font-family:'Noto Sans KR';}

  /* 모드 선택 탭 */
  .mode-bar{background:#fff;padding:12px 16px;display:flex;gap:8px;border-bottom:2px solid #e3f2fd;}
  .mode-btn{flex:1;padding:10px;border:2px solid #e0e0e0;border-radius:12px;background:#f5f5f5;font-family:'Noto Sans KR';font-size:14px;font-weight:700;cursor:pointer;color:#888;transition:all .2s;}
  .mode-btn.active{background:var(--navy);border-color:var(--navy);color:#fff;}
  .mode-btn.flash.active{background:var(--purple);border-color:var(--purple);}

  /* Day 선택 */
  .day-selector{background:#fff;padding:12px 16px;border-bottom:1px solid #e3f2fd;overflow-x:auto;white-space:nowrap;}
  .day-selector::-webkit-scrollbar{height:4px;}
  .day-selector::-webkit-scrollbar-thumb{background:#90caf9;border-radius:10px;}
  .day-tab{display:inline-block;padding:7px 14px;border:2px solid #e0e0e0;border-radius:20px;background:#f5f5f5;font-size:13px;font-weight:700;cursor:pointer;color:#888;margin-right:5px;transition:all .15s;font-family:'Noto Sans KR';}
  .day-tab.active{background:var(--navy);border-color:var(--navy);color:#fff;}
  .day-tab.flash-active{background:var(--purple);border-color:var(--purple);color:#fff;}

  /* ══ 단어장 모드 ══ */
  #mode-book{display:block;}
  .book-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px;max-width:700px;margin:0 auto;}
  @media(min-width:600px){.book-grid{grid-template-columns:repeat(3,1fr);}}
  .word-card{background:#fff;border-radius:14px;padding:16px 12px;text-align:center;box-shadow:0 2px 8px rgba(13,71,161,.08);border:2px solid #e3f2fd;}
  .word-en{font-size:18px;font-weight:900;color:var(--navy);margin-bottom:6px;}
  .word-ko{font-size:14px;color:#5c6bc0;font-weight:700;}
  .word-num{font-size:10px;color:#bbb;margin-bottom:4px;}

  /* ══ 플래시카드 모드 ══ */
  #mode-flash{display:none;}
  .flash-wrap{padding:16px;max-width:500px;margin:0 auto;}

  /* 진행 표시 */
  .flash-progress{margin-bottom:16px;}
  .fp-bar{height:6px;background:#e0e0e0;border-radius:10px;overflow:hidden;margin-bottom:6px;}
  .fp-fill{height:100%;background:linear-gradient(90deg,var(--purple),var(--sky));border-radius:10px;transition:width .4s;}
  .fp-text{display:flex;justify-content:space-between;font-size:12px;color:#888;}

  /* 플래시카드 */
  .flash-card{perspective:1000px;height:220px;cursor:pointer;margin-bottom:20px;user-select:none;}
  .flash-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;}
  .flash-card.flipped .flash-inner{transform:rotateY(180deg);}
  .flash-front,.flash-back{position:absolute;inset:0;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;backface-visibility:hidden;}
  .flash-front{background:var(--navy);color:#fff;}
  .flash-back{background:var(--green);color:#fff;transform:rotateY(180deg);}
  .flash-hint{font-size:12px;opacity:.65;margin-bottom:10px;letter-spacing:1px;}
  .flash-word{font-family:'Black Han Sans';font-size:36px;letter-spacing:2px;text-align:center;}
  .flash-sub{font-size:14px;margin-top:8px;opacity:.8;text-align:center;}
  .flash-tap{font-size:12px;opacity:.55;margin-top:14px;}

  /* 버튼들 */
  .flash-btns{display:flex;gap:10px;margin-bottom:20px;}
  .flash-btn{flex:1;padding:14px;border:none;border-radius:14px;font-family:'Black Han Sans';font-size:16px;cursor:pointer;transition:all .15s;letter-spacing:1px;}
  .btn-again{background:#ffebee;color:var(--red);}
  .btn-again:hover{background:#ffcdd2;}
  .btn-know{background:#e8f5e9;color:var(--green);}
  .btn-know:hover{background:#c8e6c9;}

  /* 결과 화면 */
  .flash-result{text-align:center;padding:30px 16px;display:none;}
  .result-emoji{font-size:64px;display:block;margin-bottom:12px;}
  .result-score{font-family:'Black Han Sans';font-size:48px;color:var(--navy);margin-bottom:6px;}
  .result-msg{font-size:15px;color:#5c6bc0;margin-bottom:24px;}
  .result-miss{background:#fff;border-radius:14px;padding:16px;margin-bottom:20px;text-align:left;}
  .result-miss-title{font-weight:700;color:var(--red);font-size:14px;margin-bottom:10px;}
  .miss-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f5f5f5;font-size:13px;}
  .miss-item:last-child{border-bottom:none;}
  .miss-en{font-weight:700;color:var(--navy);}
  .miss-ko{color:#5c6bc0;}
  .restart-btn{background:var(--purple);color:#fff;border:none;padding:14px 32px;border-radius:14px;font-family:'Black Han Sans';font-size:18px;cursor:pointer;margin-right:8px;}
  .restart-btn:hover{filter:brightness(1.1);}
  .retry-miss-btn{background:#ffebee;color:var(--red);border:none;padding:14px 20px;border-radius:14px;font-family:'Black Han Sans';font-size:16px;cursor:pointer;}
  .retry-miss-btn:hover{background:#ffcdd2;}

  /* 카드 없음 */
  .no-day{text-align:center;padding:40px 16px;color:#aaa;font-size:15px;}

  /* ══ 모의시험 모드 ══ */
  #mode-test{display:none;}
  .test-wrap{padding:16px;max-width:500px;margin:0 auto;}
  .test-progress{margin-bottom:16px;}
  .test-card{background:#fff;border-radius:20px;padding:28px 20px;margin-bottom:16px;box-shadow:0 4px 16px rgba(13,71,161,.12);text-align:center;}
  .test-qnum{font-size:12px;color:#aaa;font-weight:700;margin-bottom:10px;letter-spacing:1px;}
  .test-direction{display:inline-block;padding:4px 14px;border-radius:20px;font-size:12px;font-weight:700;margin-bottom:14px;}
  .dir-ko{background:#e3f2fd;color:var(--navy);}
  .dir-en{background:#e8f5e9;color:var(--green);}
  .test-question{font-family:'Black Han Sans',sans-serif;font-size:34px;color:var(--navy);margin-bottom:24px;letter-spacing:1px;}
  .test-input{width:100%;padding:14px 16px;border:2.5px solid #e0e0e0;border-radius:14px;font-size:20px;text-align:center;font-family:'Noto Sans KR';outline:none;transition:border-color .2s;margin-bottom:12px;}
  .test-input:focus{border-color:var(--sky);}
  .test-input.correct{border-color:var(--green);background:#e8f5e9;color:var(--green);}
  .test-input.wrong{border-color:var(--red);background:#ffebee;color:var(--red);}
  .test-submit{width:100%;padding:14px;border:none;border-radius:14px;background:var(--navy);color:#fff;font-family:'Black Han Sans',sans-serif;font-size:18px;cursor:pointer;transition:all .2s;letter-spacing:1px;}
  .test-submit:hover{background:#1565C0;}
  .test-submit:disabled{background:#ccc;cursor:default;}
  .test-feedback{padding:14px;border-radius:12px;font-size:14px;font-weight:700;margin-bottom:12px;display:none;text-align:center;}
  .test-feedback.correct{background:#e8f5e9;color:var(--green);border:2px solid #a5d6a7;}
  .test-feedback.wrong{background:#ffebee;color:var(--red);border:2px solid #ef9a9a;}
  .test-next{width:100%;padding:13px;border:none;border-radius:14px;background:var(--sky);color:var(--navy);font-family:'Black Han Sans',sans-serif;font-size:17px;cursor:pointer;display:none;letter-spacing:1px;}
  .test-next:hover{background:#29B6F6;}
  .test-score-bar{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:12px;padding:10px 16px;margin-bottom:14px;font-size:13px;font-weight:700;}
  .score-ok{color:var(--green);}
  .score-ng{color:var(--red);}
</style>
</head>
<body>

<div class="topbar">
  <h1>📖 단어장</h1>
  <a href="/student" class="back-btn">← 홈으로</a>
</div>

<!-- 모드 선택 -->
<div class="mode-bar">
  <button class="mode-btn active" id="modeBookBtn" onclick="setMode('book')">📚 단어장</button>
  <button class="mode-btn flash" id="modeFlashBtn" onclick="setMode('flash')">⚡ 플래시카드</button>
  <button class="mode-btn" id="modeTestBtn" onclick="setMode('test')" style="background:#fff3e0;border-color:#ffcc80;color:#e65100;">✏️ 모의시험</button>
</div>

<!-- Day 탭 -->
<div class="day-selector" id="daySelector">
  {% for d in range(1,31) %}
  <span class="day-tab {{ 'active' if loop.first else '' }}" data-day="{{ d }}" onclick="selectDay({{ d }})">Day{{ d }}</span>
  {% endfor %}
</div>

<!-- 단어장 모드 -->
<div id="mode-book">
  <div class="book-grid" id="bookGrid"></div>
</div>

<!-- 플래시카드 모드 -->
<div id="mode-flash">
  <div class="flash-wrap">
    <div id="flashMain">
      <div class="flash-progress">
        <div class="fp-bar"><div class="fp-fill" id="fpFill" style="width:0%"></div></div>
        <div class="fp-text"><span id="fpText">0 / 0</span><span id="fpKnow">✅ 0개 암기</span></div>
      </div>
      <div class="flash-card" id="flashCard" onclick="flipCard()">
        <div class="flash-inner">
          <div class="flash-front">
            <span class="flash-hint" id="flashHint">터치하면 뜻이 나와요</span>
            <div class="flash-word" id="flashWord">-</div>
            <div class="flash-tap">👆 탭해서 확인</div>
          </div>
          <div class="flash-back">
            <span class="flash-hint" id="flashHintBack">뜻</span>
            <div class="flash-word" id="flashMeaning">-</div>
            <div class="flash-sub" id="flashSub"></div>
          </div>
        </div>
      </div>
      <div class="flash-btns" id="flashBtns" style="display:none;">
        <button class="flash-btn btn-again" onclick="markCard(false)">😅 다시</button>
        <button class="flash-btn btn-know" onclick="markCard(true)">✅ 암기!</button>
      </div>
    </div>
    <div class="flash-result" id="flashResult">
      <span class="result-emoji" id="resultEmoji">🎉</span>
      <div class="result-score" id="resultScore">0 / 0</div>
      <div class="result-msg" id="resultMsg"></div>
      <div class="result-miss" id="resultMiss" style="display:none;">
        <div class="result-miss-title">❌ 틀린 단어</div>
        <div id="missList"></div>
      </div>
      <button class="restart-btn" onclick="startFlash()">🔄 다시하기</button>
      <button class="retry-miss-btn" id="retryMissBtn" onclick="retryMiss()" style="display:none;">❌ 틀린 것만</button>
    </div>
  </div>
</div>

<!-- 모의시험 모드 -->
<div id="mode-test">
  <div class="test-wrap">
    <div class="test-score-bar">
      <span>📊 진행: <span id="testProgress">0 / 0</span></span>
      <span class="score-ok">✅ <span id="testOkCount">0</span>개</span>
      <span class="score-ng">❌ <span id="testNgCount">0</span>개</span>
    </div>
    <div class="fp-bar" style="margin-bottom:14px;"><div class="fp-fill" id="testFpFill" style="width:0%"></div></div>

    <div id="testMain">
      <div class="test-card">
        <div class="test-qnum" id="testQNum">1번</div>
        <span class="test-direction" id="testDir">한글 → 영어</span>
        <div class="test-question" id="testQ">-</div>
        <input type="text" class="test-input" id="testInput"
          placeholder="답을 입력하세요"
          onkeydown="if(event.key==='Enter')checkAnswer()"
          autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <div class="test-feedback" id="testFeedback"></div>
        <button class="test-submit" id="testSubmit" onclick="checkAnswer()">확인</button>
        <button class="test-next" id="testNextBtn" onclick="nextTestQ()">다음 문제 →</button>
      </div>
    </div>

    <div class="flash-result" id="testResult" style="display:none;">
      <span class="result-emoji" id="testResultEmoji">🎉</span>
      <div class="result-score" id="testResultScore">0 / 0</div>
      <div class="result-msg" id="testResultMsg"></div>
      <div class="result-miss" id="testResultMiss" style="display:none;">
        <div class="result-miss-title">❌ 틀린 단어</div>
        <div id="testMissList"></div>
      </div>
      <button class="restart-btn" onclick="startTest()">🔄 다시하기</button>
      <button class="retry-miss-btn" id="testRetryBtn" onclick="retryTestMiss()" style="display:none;">❌ 틀린 것만</button>
    </div>
  </div>
</div>


<script>
// ── 단어 데이터 ──────────────────────────────────────
const WORD_DAYS = {{ word_days | tojson }};

let currentDay = 1;
let currentMode = 'book';
let flashQueue = [];
let flashIndex = 0;
let knowCount = 0;
let missedWords = [];
let isFlipped = false;

// ── 초기화 ──────────────────────────────────────────
function init() {
  selectDay(1);
}

function setMode(mode) {
  currentMode = mode;
  document.getElementById('mode-book').style.display  = mode === 'book'  ? 'block' : 'none';
  document.getElementById('mode-flash').style.display = mode === 'flash' ? 'block' : 'none';
  document.getElementById('mode-test').style.display  = mode === 'test'  ? 'block' : 'none';
  document.getElementById('modeBookBtn').classList.toggle('active', mode === 'book');
  document.getElementById('modeFlashBtn').classList.toggle('active', mode === 'flash');
  const testBtn = document.getElementById('modeTestBtn');
  if (mode === 'test') { testBtn.style.background='#FF6F00'; testBtn.style.color='#fff'; testBtn.style.borderColor='#FF6F00'; }
  else { testBtn.style.background='#fff3e0'; testBtn.style.color='#e65100'; testBtn.style.borderColor='#ffcc80'; }
  updateDayTabs();
  if (mode === 'flash') startFlash();
  if (mode === 'test') startTest();
}

function selectDay(day) {
  currentDay = day;
  updateDayTabs();
  if (currentMode === 'book') renderBook();
  else if (currentMode === 'test') startTest();
  else startFlash();
}

function updateDayTabs() {
  document.querySelectorAll('.day-tab').forEach(t => {
    const d = parseInt(t.dataset.day);
    t.classList.remove('active','flash-active');
    if (d === currentDay) {
      t.classList.add((currentMode === 'flash' || currentMode === 'test') ? 'flash-active' : 'active');
    }
  });
}

// ── 단어장 모드 ──────────────────────────────────────
function renderBook() {
  const words = WORD_DAYS[currentDay] || [];
  const grid = document.getElementById('bookGrid');
  if (!words.length) {
    grid.innerHTML = '<div class="no-day">단어가 없어요.</div>';
    return;
  }
  grid.innerHTML = words.map((w, i) => `
    <div class="word-card">
      <div class="word-num">${i+1}</div>
      <div class="word-en">${w.en}</div>
      <div class="word-ko">${w.ko}</div>
    </div>`).join('');
}

// ── 플래시카드 모드 ──────────────────────────────────
function startFlash(wordList) {
  const words = wordList || (WORD_DAYS[currentDay] || []);
  if (!words.length) return;

  // 섞기
  flashQueue = [...words].sort(() => Math.random() - 0.5);
  // 각 단어에 방향 랜덤 설정 (ko→en or en→ko)
  flashQueue = flashQueue.map(w => ({
    ...w,
    showEn: Math.random() > 0.5  // true면 영어 문제, false면 한글 문제
  }));

  flashIndex = 0;
  knowCount = 0;
  missedWords = [];
  isFlipped = false;

  document.getElementById('flashResult').style.display = 'none';
  document.getElementById('flashMain').style.display = 'block';
  document.getElementById('flashBtns').style.display = 'none';
  document.getElementById('flashCard').classList.remove('flipped');

  showCard();
}

function retryMiss() {
  startFlash(missedWords.map(w => ({ ko: w.ko, en: w.en })));
}

function showCard() {
  if (flashIndex >= flashQueue.length) {
    showResult();
    return;
  }
  const w = flashQueue[flashIndex];
  isFlipped = false;
  document.getElementById('flashCard').classList.remove('flipped');
  document.getElementById('flashBtns').style.display = 'none';

  if (w.showEn) {
    // 영어 보여주고 한글 맞추기
    document.getElementById('flashWord').textContent = w.en;
    document.getElementById('flashMeaning').textContent = w.ko;
    document.getElementById('flashSub').textContent = '';
    document.getElementById('flashHint').textContent = '영어 → 한글';
    document.getElementById('flashHintBack').textContent = '뜻 (한글)';
  } else {
    // 한글 보여주고 영어 맞추기
    document.getElementById('flashWord').textContent = w.ko;
    document.getElementById('flashMeaning').textContent = w.en;
    document.getElementById('flashSub').textContent = '';
    document.getElementById('flashHint').textContent = '한글 → 영어';
    document.getElementById('flashHintBack').textContent = '영어 단어';
  }

  updateProgress();
}

function flipCard() {
  if (isFlipped) return;
  isFlipped = true;
  document.getElementById('flashCard').classList.add('flipped');
  document.getElementById('flashBtns').style.display = 'flex';
}

function markCard(know) {
  if (know) {
    knowCount++;
  } else {
    missedWords.push(flashQueue[flashIndex]);
  }
  flashIndex++;
  isFlipped = false;
  document.getElementById('flashCard').classList.remove('flipped');
  document.getElementById('flashBtns').style.display = 'none';
  setTimeout(showCard, 200);
}

function updateProgress() {
  const total = flashQueue.length;
  const done = flashIndex;
  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById('fpFill').style.width = pct + '%';
  document.getElementById('fpText').textContent = `${done} / ${total}`;
  document.getElementById('fpKnow').textContent = `✅ ${knowCount}개 암기`;
}

function showResult() {
  document.getElementById('flashMain').style.display = 'none';
  const result = document.getElementById('flashResult');
  result.style.display = 'block';

  const total = flashQueue.length;
  const pct = Math.round(knowCount / total * 100);

  let emoji, msg;
  if (pct === 100)     { emoji = '🏆'; msg = '완벽해요! 모든 단어를 암기했어요!'; }
  else if (pct >= 80)  { emoji = '🎉'; msg = '훌륭해요! 거의 다 외웠어요!'; }
  else if (pct >= 60)  { emoji = '👍'; msg = '잘하고 있어요! 조금만 더!'; }
  else                 { emoji = '📖'; msg = '틀린 단어를 다시 복습해봐요!'; }

  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultScore').textContent = `${knowCount} / ${total}`;
  document.getElementById('resultMsg').textContent = msg;

  if (missedWords.length > 0) {
    const missList = document.getElementById('missList');
    missList.innerHTML = missedWords.map(w =>
      `<div class="miss-item"><span class="miss-en">${w.en}</span><span class="miss-ko">${w.ko}</span></div>`
    ).join('');
    document.getElementById('resultMiss').style.display = 'block';
    document.getElementById('retryMissBtn').style.display = 'inline-block';
  } else {
    document.getElementById('resultMiss').style.display = 'none';
    document.getElementById('retryMissBtn').style.display = 'none';
  }
}

// 스와이프 제스처 지원
let touchStartX = 0;
document.getElementById('flashCard').addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
});
document.getElementById('flashCard').addEventListener('touchend', e => {
  const diff = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(diff) < 10) return; // 탭으로 처리
});

// ── 모의시험 로직 ──────────────────────────────────
let testQueue = [];
let testIndex = 0;
let testOk = 0;
let testNg = 0;
let testMissed = [];
let testAnswered = false;

function startTest(wordList) {
  const words = wordList || (WORD_DAYS[currentDay] || []);
  if (!words.length) return;

  // 섞기 + 방향 랜덤
  testQueue = [...words].sort(() => Math.random() - 0.5).map(w => ({
    ...w,
    showEn: Math.random() > 0.5
  }));

  testIndex = 0; testOk = 0; testNg = 0; testMissed = [];
  testAnswered = false;

  document.getElementById('testResult').style.display = 'none';
  document.getElementById('testMain').style.display = 'block';
  showTestQ();
}

function retryTestMiss() {
  startTest(testMissed.map(w => ({ ko: w.ko, en: w.en })));
}

function showTestQ() {
  if (testIndex >= testQueue.length) {
    showTestResult();
    return;
  }
  const w = testQueue[testIndex];
  testAnswered = false;

  const input = document.getElementById('testInput');
  input.value = '';
  input.className = 'test-input';
  input.disabled = false;
  input.placeholder = w.showEn ? '한글로 입력하세요' : '영어로 입력하세요';

  document.getElementById('testFeedback').style.display = 'none';
  document.getElementById('testSubmit').style.display = 'block';
  document.getElementById('testSubmit').disabled = false;
  document.getElementById('testNextBtn').style.display = 'none';

  document.getElementById('testQNum').textContent = (testIndex + 1) + '번';
  document.getElementById('testDir').textContent = w.showEn ? '영어 → 한글' : '한글 → 영어';
  document.getElementById('testDir').className = 'test-direction ' + (w.showEn ? 'dir-en' : 'dir-ko');
  document.getElementById('testQ').textContent = w.showEn ? w.en : w.ko;

  updateTestProgress();
  setTimeout(() => input.focus(), 100);
}

function checkAnswer() {
  if (testAnswered) { nextTestQ(); return; }
  const w = testQueue[testIndex];
  const input = document.getElementById('testInput');
  const userAns = input.value.trim();
  if (!userAns) return;

  const correct = w.showEn ? w.ko : w.en;
  const isRight = userAns.toLowerCase() === correct.toLowerCase();

  testAnswered = true;
  input.disabled = true;
  input.className = 'test-input ' + (isRight ? 'correct' : 'wrong');

  const fb = document.getElementById('testFeedback');
  if (isRight) {
    fb.innerHTML = '🎉 정답! <strong>' + correct + '</strong>';
    fb.className = 'test-feedback correct';
    testOk++;
  } else {
    fb.innerHTML = '❌ 틀렸어요! 정답: <strong>' + correct + '</strong>';
    fb.className = 'test-feedback wrong';
    testNg++;
    testMissed.push(w);
  }
  fb.style.display = 'block';

  document.getElementById('testSubmit').style.display = 'none';
  document.getElementById('testNextBtn').style.display = 'block';
  document.getElementById('testNextBtn').textContent =
    testIndex === testQueue.length - 1 ? '결과 보기 🏁' : '다음 문제 →';

  updateTestProgress();
}

function nextTestQ() {
  testIndex++;
  showTestQ();
}

function updateTestProgress() {
  const total = testQueue.length;
  document.getElementById('testProgress').textContent = testIndex + ' / ' + total;
  document.getElementById('testOkCount').textContent = testOk;
  document.getElementById('testNgCount').textContent = testNg;
  const pct = total ? Math.round(testIndex / total * 100) : 0;
  document.getElementById('testFpFill').style.width = pct + '%';
}

function showTestResult() {
  document.getElementById('testMain').style.display = 'none';
  const result = document.getElementById('testResult');
  result.style.display = 'block';

  const total = testQueue.length;
  const pct = Math.round(testOk / total * 100);
  let emoji, msg;
  if (pct === 100)    { emoji='🏆'; msg='완벽해요! 모든 단어를 맞췄어요!'; }
  else if (pct >= 80) { emoji='🎉'; msg='훌륭해요! 거의 다 맞췄어요!'; }
  else if (pct >= 60) { emoji='👍'; msg='잘하고 있어요! 조금만 더!'; }
  else                { emoji='📖'; msg='틀린 단어들을 다시 외워봐요!'; }

  document.getElementById('testResultEmoji').textContent = emoji;
  document.getElementById('testResultScore').textContent = testOk + ' / ' + total;
  document.getElementById('testResultMsg').textContent = msg;

  if (testMissed.length > 0) {
    const list = document.getElementById('testMissList');
    list.innerHTML = testMissed.map(w =>
      '<div class="miss-item"><span class="miss-en">' + w.en + '</span><span class="miss-ko">' + w.ko + '</span></div>'
    ).join('');
    document.getElementById('testResultMiss').style.display = 'block';
    document.getElementById('testRetryBtn').style.display = 'inline-block';
  } else {
    document.getElementById('testResultMiss').style.display = 'none';
    document.getElementById('testRetryBtn').style.display = 'none';
  }
}

// 키보드 단축키
document.addEventListener('keydown', e => {
  if (currentMode !== 'flash') return;
  if (e.code === 'Space') { e.preventDefault(); flipCard(); }
  if (e.code === 'ArrowLeft' && isFlipped) markCard(false);
  if (e.code === 'ArrowRight' && isFlipped) markCard(true);
});

init();
</script>
