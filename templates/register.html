<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비밀번호 등록</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Black+Han+Sans&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --sky: #4FC3F7; --navy: #0D47A1; --green: #43A047; --red: #E53935; --bg: #E3F2FD; }
  body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card { background: #fff; border-radius: 20px; padding: 40px 32px; box-shadow: 0 8px 32px rgba(13,71,161,.12); width: 100%; max-width: 380px; text-align: center; }
  .emoji { font-size: 56px; display: block; margin-bottom: 16px; }
  h2 { font-family: 'Black Han Sans'; font-size: 24px; color: var(--navy); margin-bottom: 6px; }
  .sub { font-size: 14px; color: #888; margin-bottom: 28px; }
  .num-badge { display: inline-block; background: var(--sky); color: var(--navy); font-family: 'Black Han Sans'; font-size: 28px; padding: 8px 24px; border-radius: 12px; margin-bottom: 24px; }
  label { display: block; font-size: 13px; font-weight: 700; color: #5c6bc0; margin-bottom: 8px; text-align: left; }
  input[type=password] { width: 100%; padding: 16px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 24px; text-align: center; letter-spacing: 12px; margin-bottom: 8px; outline: none; }
  input[type=password]:focus { border-color: var(--sky); }
  .hint { font-size: 12px; color: #aaa; margin-bottom: 20px; }
  .error { background: #ffebee; color: var(--red); border-radius: 10px; padding: 10px; font-size: 13px; margin-bottom: 16px; }
  .btn { width: 100%; padding: 16px; border: none; border-radius: 12px; font-family: 'Black Han Sans'; font-size: 18px; cursor: pointer; background: var(--green); color: #fff; }
  .back { display: block; margin-top: 14px; color: #aaa; font-size: 13px; text-decoration: none; }
</style>
</head>
<body>
<div class="card">
  <span class="emoji">🔐</span>
  <h2>비밀번호 등록</h2>
  <p class="sub">처음 접속이에요! 나만의 비밀번호를 만들어요.</p>
  <div class="num-badge">{{ num }}번</div>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="/register">
    <input type="hidden" name="num" value="{{ num }}">
    <label>숫자 4자리 비밀번호</label>
    <input type="password" name="new_pw" maxlength="4" inputmode="numeric" placeholder="••••" autocomplete="new-password" autofocus>
    <p class="hint">※ 잊어버리면 선생님께 초기화 요청하세요</p>
    <button type="submit" class="btn">등록하고 입장하기</button>
  </form>
  <a href="/" class="back">← 돌아가기</a>
</div>
</body>
</html>
